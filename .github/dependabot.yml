version: 2
updates:
  # CI only: action has no dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      Actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - dependencies
  # CI only: python code has no dependencies
  - package-ecosystem: uv
    directory: /
    exclude-paths:
      - test/**
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      Python:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - dependencies

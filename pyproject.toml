[project]
name = "uv-dependency-submission"
version = "1.1.1"
description = "GitHub Action for submitting uv.lock dependencies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.16.0",
  "basedpyright==1.39.9",
  "pytest==9.1.1"
]

[tool.basedpyright]
pythonVersion = "3.12"
exclude = [
  "data",
  ".venv"
]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 120
